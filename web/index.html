<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Set the theme before first paint so a dark-mode OS never flashes the
      // dark UI on the way to the warm light default. Mirrors lib/theme.initTheme.
      try {
        var t = localStorage.getItem("openscreentime-theme");
        document.documentElement.setAttribute(
          "data-theme",
          t === "dark" || t === "light" ? t : "light",
        );
      } catch (e) {}
    </script>
    <title>OpenScreenTime</title>
    <meta name="description" content="Screen time for the whole family — glanceable, honest, and yours. Runs on your hardware: no cloud, no accounts, no telemetry." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenScreenTime" />
    <meta property="og:description" content="Screen time for the whole family — on your hardware. No cloud, no accounts, no telemetry." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
