  <circle cx="32" cy="32" r="20" fill="none" stroke="#2a2a2a" stroke-width="7"/>
  <path d="M 32 12 A 20 20 0 1 1 14.68 42" fill="none" stroke="#4a9e5c"
        stroke-width="7" stroke-linecap="round"/>
</svg>
