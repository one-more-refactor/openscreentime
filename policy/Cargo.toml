[package]
name = "openscreentime-policy"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "OpenScreenTime — the shared Policy document (stored by the server, edited by the web, enforced by the agent)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
