[package]
name = "sentinel-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sentinel zero-trust device management — Linux client agent"
license = "MIT"

[[bin]]
name = "sentinel-agent"
path = "src/main.rs"

[dependencies]
sentinel-policy = { path = "../policy" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
hostname = "0.4"
users = "0.11"
base64 = "0.22"
rand = "0.8"
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }
libc = "0.2"
argon2 = "0.5"

# Optional native full-screen GUI for the lockout overlay. Off by default so the
# agent builds and runs on a headless dev box (see lockout.rs for the stub path).
eframe = { version = "0.28", optional = true, default-features = false, features = ["default_fonts", "glow"] }

[features]
default = []
gui = ["dep:eframe"]

[profile.release]
opt-level = "z"
lto = true
strip = true
