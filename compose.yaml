# OpenScreenTime — production compose stack (Podman + podman-compose, rootful
# or rootless, or docker compose). Runs the server+web image behind the
# operator's EXISTING reverse proxy (which terminates TLS) — see docs/DEPLOY.md.
#
# Usage: deploy/setup.sh --domain ost.example.com  (writes .env, gets the image,
# starts this stack, installs start-at-boot / backup / update units).
#
# The server runs localhost/openscreentime-server:current. deploy/update.sh
# points that tag at a new image (pulled from the registry, or built from the
# Containerfile) and keeps the old one as :previous for its rollback.
#
# Note: server/docker-compose.yml is a separate, untouched dev-only stack
# (DB only, for `cargo run` against a local Postgres).

services:
  db:
    image: docker.io/library/postgres:15
    container_name: openscreentime-db
    # `always` (not unless-stopped): Podman's own boot service only restarts
    # `always` containers; deploy/setup.sh also installs openscreentime.service.
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openscreentime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openscreentime}
    # Prod: keep Postgres internal-only (no host port published). For local
    # debugging you can temporarily uncomment the next two lines.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - ost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openscreentime} -d ${POSTGRES_DB:-openscreentime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: localhost/openscreentime-server:current
    # Only used by `compose build` / `up --build`; the deploy scripts tag
    # :current themselves.
    build:
      context: .
      dockerfile: Containerfile
    container_name: openscreentime-server
    restart: always
    # /health answers 200 only while the server AND its database work. The
    # runtime image has no curl, so the binary probes itself.
    healthcheck:
      test: ["CMD", "/app/openscreentime-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # Everything the operator sets goes in via the file itself, NOT as
    # `VAR: ${VAR:-}` passthrough lines.
    #
    # podman-compose does not expand `${VAR:-default}` when VAR is undefined —
    # it forwards the literal string. A container then starts with
    # OST_OIDC_ISSUER set to "${OST_OIDC_ISSUER:-}", which is not empty, so
    # OIDC discovery runs against a nonsense URL and the server crash-loops on
    # every fresh no-OIDC deploy. Nested defaults fare worse: `${A:-${B}}`
    # came out as "https://host}", with the trailing brace.
    #
    # env_file has none of that: a variable absent from .env is absent from
    # the container, which is exactly the "unset" the server already handles.
    env_file:
      - .env
    environment:
      # Composed here because it is derived, not configured.
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Always 0.0.0.0 INSIDE the container; what the host publishes is the
      # `ports` mapping below.
      BIND_ADDR: 0.0.0.0:8080
    # Defaults to loopback: the app port is normally reached only via the host's
    # own reverse proxy (which terminates TLS and forwards to the port below).
    #
    # OST_BIND_ADDR exists for the split deployment — proxy on one host, this
    # stack on another — where the app must listen on a LAN address the proxy
    # can route to. Set it to that specific address, never 0.0.0.0: the server
    # trusts X-Forwarded-For (OST_TRUST_PROXY), so anything that can reach the
    # port directly can also forge its own client IP past the rate limiter.
    ports:
      - "${OST_BIND_ADDR:-127.0.0.1}:${OST_PORT:-8080}:8080"

volumes:
  ost_pgdata:
