# OpenScreenTime — production compose stack (rootless Podman / podman-compose, or
# docker compose). Builds the server+web image from ../Containerfile and runs
# it behind the operator's EXISTING external reverse proxy (which terminates
# TLS) — see docs/DEPLOY.md.
#
# Usage:
#   cp .env.example .env   # then edit .env
#   podman-compose up -d
#
# Note: server/docker-compose.yml is a separate, untouched dev-only stack
# (DB only, for `cargo run` against a local Postgres).

services:
  db:
    image: docker.io/library/postgres:15
    container_name: openscreentime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openscreentime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openscreentime}
    # Prod: keep Postgres internal-only (no host port published). For local
    # debugging you can temporarily uncomment the next two lines.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - ost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openscreentime} -d ${POSTGRES_DB:-openscreentime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Containerfile
    container_name: openscreentime-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openscreentime}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-openscreentime}
      RP_ID: ${RP_ID:?set RP_ID in .env}
      RP_ORIGIN: ${RP_ORIGIN:?set RP_ORIGIN in .env}
      OST_PUBLIC_URL: ${OST_PUBLIC_URL:-${RP_ORIGIN}}
      BIND_ADDR: 0.0.0.0:8080
      # This stack only ever sits behind the host's reverse proxy (the app
      # port is loopback-published below), so default to trusting the proxy's
      # X-Forwarded-For: without it the rate limiter keys every visitor by
      # the proxy's own IP — one shared bucket → spurious 429 lockouts.
      # Set 0 only if you expose the port directly (not the supported layout).
      OST_TRUST_PROXY: ${OST_TRUST_PROXY:-1}
      # OST_INSECURE_COOKIES intentionally NOT set here — cookies stay
      # Secure in prod. Only set it in .env for local plain-http testing.
      OST_INSECURE_COOKIES: ${OST_INSECURE_COOKIES:-}
      OST_OIDC_ISSUER: ${OST_OIDC_ISSUER:-}
      OST_OIDC_CLIENT_ID: ${OST_OIDC_CLIENT_ID:-}
      OST_OIDC_CLIENT_SECRET: ${OST_OIDC_CLIENT_SECRET:-}
      OST_OIDC_NAME: ${OST_OIDC_NAME:-}
      RUST_LOG: ${RUST_LOG:-openscreentime_server=info,tower_http=info,info}
    # Defaults to loopback: the app port is normally reached only via the host's
    # own reverse proxy (which terminates TLS and forwards to the port below).
    #
    # OST_BIND_ADDR exists for the split deployment — proxy on one host, this
    # stack on another — where the app must listen on a LAN address the proxy
    # can route to. Set it to that specific address, never 0.0.0.0: the server
    # trusts X-Forwarded-For (OST_TRUST_PROXY), so anything that can reach the
    # port directly can also forge its own client IP past the rate limiter.
    ports:
      - "${OST_BIND_ADDR:-127.0.0.1}:${OST_PORT:-8080}:8080"

volumes:
  ost_pgdata:
