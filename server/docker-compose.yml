services:
  db:
    image: docker.io/library/postgres:15
    container_name: openscreentime-db
    environment:
      POSTGRES_USER: openscreentime
      POSTGRES_PASSWORD: openscreentime
      POSTGRES_DB: openscreentime
    ports:
      # Dev only, and on loopback only: this password is in the repo.
      - "127.0.0.1:5432:5432"
    volumes:
      - ost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openscreentime -d openscreentime"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  ost_pgdata:
